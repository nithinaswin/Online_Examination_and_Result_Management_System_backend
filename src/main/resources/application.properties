# Application Server Configuration
server.port=${PORT:8080}
server.shutdown=graceful

# JPA / Hibernate Schema Management
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Database Configuration:
# If SPRING_DATASOURCE_URL is provided (Cloud MySQL), Spring Boot connects using MySQL Driver.
# If no external MySQL is configured, it automatically uses embedded storage so the service boots and stays alive reliably on cloud hosts.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/examdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# Connection Pooling (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# Actuator Health Check for Render / Cloud Web Services
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# JWT Configuration
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Bootstrap Initial Admin (Startup Initialization)
app.admin.email=${ADMIN_EMAIL:admin@college.edu}
app.admin.password=${ADMIN_PASSWORD:AdminSecurePass123!}
app.admin.name=${ADMIN_NAME:System Administrator}

# Allowed Origins for CORS
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

# Exam Configuration
app.exam.grace-period-seconds=${EXAM_GRACE_PERIOD_SECONDS:15}
